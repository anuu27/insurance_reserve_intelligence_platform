project_name: src
experiment_name: actuary_twin_term_life_pinn
seed: 42

paths:
  artifacts_dir: artifacts
  checkpoints_dir: artifacts/checkpoints
  logs_dir: artifacts/logs
  reports_dir: artifacts/reports
  plots_dir: artifacts/plots
  tensorboard_dir: artifacts/tensorboard
  data_dir: data

data:
  train_size: 400
  validation_size: 100
  test_size: 100
  time_steps: 32
  batch_size: 64
  num_workers: 0
  age_min: 25
  age_max: 70
  term_min: 5
  term_max: 30
  interest_rate_min: 0.01
  interest_rate_max: 0.08
  sum_assured_min: 50000.0
  sum_assured_max: 1000000.0
  mortality_scale: 0.00045
  mortality_shape: 1.085
  mortality_reference_age: 25
  premium_loading: 1.10
  max_expiry_age: 80
  sum_assured_rounding: 50000.0
  sum_assured_age_decay: 0.02
  random_seed: 42

solver:
  method: solve_ivp
  integration_step: 0.25
  rtol: 1.0e-6
  atol: 1.0e-8

model:
  input_dim: 6
  hidden_dim: 128
  num_layers: 4
  activation: tanh
  dropout: 0.1
  skip_connections: false

losses:
  lambda_data: 1.0
  lambda_pde: 1.0
  lambda_boundary: 1.0
  lambda_reg: 1.0e-6

trainer:
  run_name: actuary_twin_term_life_pinn
  epochs: 500
  learning_rate: 0.001
  weight_decay: 1.0e-5
  gradient_clip_norm: 1.0
  early_stopping_patience: 50
  scheduler_patience: 20
  scheduler_factor: 0.5
  checkpoint_every: 2
  resume_from:
  device: auto
  tensorboard_enabled: true
  mixed_precision: true

stress:
  mortality_shock: 0.15
  interest_rate_shock: -0.01
  inflation_shock: 0.05
  longevity_shock: -0.10
  lapse_shock: 0.10

optimization:
  learning_rate: 0.05
  steps: 100
  reserve_tolerance: 1.0e-4
  solvency_threshold: 0.0

digital_twin:
  forecast_horizon: 30
  scenario_steps: 12
  regime_names:
    - base
    - soft_recession
    - inflationary
    - mortality_crisis
